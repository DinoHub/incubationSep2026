services:
  mcp-server:
    build: .
    image: mcp-doc-tools:latest
    ports:
      - "8000:8000"          # host:container
    environment:
      # Defaults point at the bundled Keycloak, so `docker compose --profile dev
      # up` works with no configuration. Set OIDC_ISSUER in .env to aim the same
      # image at a real provider; see .env.example.
      #
      # The issuer is spelled localhost, not keycloak, on purpose. It is the URL
      # a *client* uses: it appears in the token's `iss` claim, and this server
      # publishes it so an MCP host can discover where to sign in. A host runs
      # on your machine and cannot resolve a Docker service name.
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/mcp-doc-tools}
      # ...which leaves this container unable to resolve its own issuer, so
      # point key discovery at the Docker network name instead. Unset it when
      # you switch OIDC_ISSUER to a real provider.
      OIDC_JWKS_URL: ${OIDC_JWKS_URL-http://keycloak:8080/realms/mcp-doc-tools/protocol/openid-connect/certs}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:-realm_access.roles}
      SERVER_URL: ${SERVER_URL:-http://localhost:8000}
      PORT: "8000"
    volumes:
      - ./documents:/app/documents
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Runs the in-process check, then exits. Profile-gated so a plain `up` skips
  # it. It does not need mcp-server running — it runs the server in-process.
  test:
    environment:
      # The in-process test never verifies a token, so this only has to be a
      # syntactically valid URL — nothing ever contacts it. Pointing it somewhere
      # deliberately useless is the reminder that test_server.py does not and
      # cannot test authentication; test_auth.py is what does.
      OIDC_ISSUER: http://issuer-not-used-by-in-process-test.invalid
    build: .
    image: mcp-doc-tools:latest
    profiles: ["test"]
    volumes:
      - ./documents:/app/documents
    command: ["python", "test_server.py"]

  # --- Local identity provider (profile: dev) -----------------------------
  # Issues and signs tokens; owns the realm, the client identities, and the
  # roles they hold. Profile-gated because production has a real provider —
  # there you set OIDC_ISSUER in .env and never start this service.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    # In both profiles on purpose. `docker compose run` activates only the
    # target service's own profiles, not its dependencies', so test-auth would
    # fail with "no such service: keycloak" if this were in "dev" alone.
    profiles: ["dev", "auth-test"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Pin the issuer URL. Left alone, Keycloak stamps `iss` with whatever
      # hostname the token was requested through, so a token fetched from your
      # machine on localhost and one fetched from a container on the Docker
      # network disagree about who issued them, and one of the two is always
      # rejected with a 401 that looks exactly like a broken verifier.
      KC_HOSTNAME: http://localhost:8080
      # ...but let the token and key endpoints answer on whichever hostname
      # they were reached through, so containers can still talk to keycloak:8080
      # while browsers and tokens use localhost.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    ports:
      - "8080:8080"          # host:container — admin console at /admin
    healthcheck:
      # This image ships no curl or wget, and a bare TCP connect is enough:
      # the port only opens once the realm import has finished.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # Full-stack auth check: real tokens, over HTTP, against the running server.
  # This is the only test that exercises authentication — the in-process
  # test_server.py cannot, because it never goes through the HTTP layer where
  # tokens are checked.
  test-auth:
    build: .
    image: mcp-doc-tools:latest
    # Its own profile, not "dev": a profile-gated service still gets started by
    # `up`, and this one is a test that runs and exits. `docker compose run`
    # activates the target's profile on its own, so this needs no --profile flag
    # and, being outside "dev", is not built or started by `--profile dev up`.
    profiles: ["auth-test"]
    depends_on:
      keycloak:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    environment:
      TOKEN_URL: http://keycloak:8080/realms/mcp-doc-tools/protocol/openid-connect/token
      TARGET_URL: http://mcp-server:8000/mcp
      READER_CLIENT_ID: agent-reader
      READER_SECRET: reader-dev-secret
      WRITER_CLIENT_ID: agent-writer
      WRITER_SECRET: writer-dev-secret
      ROLE_READ: documents:read
      ROLE_WRITE: documents:write
      # The interactive client and a human login, so the test can prove the
      # refresh cycle works — that a client can outlive its access token
      # without a person pasting a new one.
      OAUTH_CLIENT_ID: claude-code
      OAUTH_USERNAME: dev-writer
      OAUTH_PASSWORD: dev-writer-password
      # What the server publishes as its authorization server. The test checks
      # the metadata document against this, because a host that cannot resolve
      # the issuer cannot sign in, and nothing else would catch that.
      EXPECTED_ISSUER: http://localhost:8080/realms/mcp-doc-tools
    command: ["python", "test_auth.py"]
